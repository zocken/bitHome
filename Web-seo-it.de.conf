#DO NOT MODIFY THIS FILE BECAUSE IT WAS GENERATED AUTOMATICALLY,
#SO ALL YOUR CHANGES WILL BE LOST THE NEXT TIME THE FILE IS GENERATED.
#IF YOU REQUIRE TO APPLY CUSTOM MODIFICATIONS, PERFORM THEM IN THE FOLLOWING FILES:
#/var/www/vhosts/system/Web-seo-it.de/conf/vhost.conf
#/var/www/vhosts/system/Web-seo-it.de/conf/vhost_ssl.conf
<IfModule mod_ssl.c>

	<VirtualHost [2a01:488:66:1000:b24d:4a96:0:1]:443 >
		ServerName "Web-seo-it.de"
		ServerAlias "www.Web-seo-it.de"
		ServerAlias "ipv6.Web-seo-it.de"
		UseCanonicalName Off

		DocumentRoot "/var/www/vhosts/Web-seo-it.de/httpdocs"
		CustomLog /var/www/vhosts/system/Web-seo-it.de/logs/access_ssl_log plesklog
		ErrorLog "/var/www/vhosts/system/Web-seo-it.de/logs/error_log"

		<IfModule mod_suexec.c>
			SuexecUserGroup "admin_web" "psacln"
		</IfModule>

		<IfModule mod_userdir.c>
			UserDir "/var/www/vhosts/Web-seo-it.de/web_users/*"
		</IfModule>

		<IfModule mod_sysenv.c>
			SetSysEnv PP_VHOST_ID "1da14177-e76b-4ccb-bf88-41563417d7cd"
		</IfModule>

		Alias "/plesk-stat" "/var/www/vhosts/system/Web-seo-it.de/statistics"
		<Location  /plesk-stat/>
			Options +Indexes
		</Location>
		<Location  /plesk-stat/logs/>
			Require valid-user
		</Location>
		Alias /webstat /var/www/vhosts/system/Web-seo-it.de/statistics/webstat
		Alias /webstat-ssl /var/www/vhosts/system/Web-seo-it.de/statistics/webstat-ssl
		Alias /ftpstat /var/www/vhosts/system/Web-seo-it.de/statistics/ftpstat
		Alias /anon_ftpstat /var/www/vhosts/system/Web-seo-it.de/statistics/anon_ftpstat
		Alias /awstats-icon /usr/share/awstats/icon

		SSLEngine on
		SSLVerifyClient none
		SSLCertificateFile /opt/psa/var/certificates/scfESPN7E
		SSLCACertificateFile /opt/psa/var/certificates/scfYbXDDM

		<Directory /var/www/vhosts/Web-seo-it.de/httpdocs>

			<IfModule mod_fcgid.c>
				<Files ~ (\.fcgi$)>
					SetHandler fcgid-script
					Options +ExecCGI
				</Files>
			</IfModule>
			<IfModule mod_proxy_fcgi.c>
				<Files ~ (\.php$)>
					SetHandler proxy:unix:///var/www/vhosts/system/Web-seo-it.de/php-fpm.sock|fcgi://127.0.0.1:9000
				</Files>
			</IfModule>

			SSLRequireSSL

			Options -Includes -ExecCGI

		</Directory>

		<Directory "/var/www/vhosts/system/Web-seo-it.de/statistics">
			AuthType Basic
			AuthName "Domainstatistiken"
			AuthUserFile "/var/www/vhosts/system/Web-seo-it.de/pd/d..httpdocs@plesk-stat"
			require valid-user
		</Directory>

		Alias /error_docs /var/www/vhosts/Web-seo-it.de/error_docs
		ErrorDocument 400 /error_docs/bad_request.html
		ErrorDocument 401 /error_docs/unauthorized.html
		ErrorDocument 403 /error_docs/forbidden.html
		ErrorDocument 404 /error_docs/not_found.html
		ErrorDocument 500 /error_docs/internal_server_error.html
		ErrorDocument 405 /error_docs/method_not_allowed.html
		ErrorDocument 406 /error_docs/not_acceptable.html
		ErrorDocument 407 /error_docs/proxy_authentication_required.html
		ErrorDocument 412 /error_docs/precondition_failed.html
		ErrorDocument 414 /error_docs/request_uri_too_long.html
		ErrorDocument 415 /error_docs/unsupported_media_type.html
		ErrorDocument 501 /error_docs/not_implemented.html
		ErrorDocument 502 /error_docs/bad_gateway.html
		ErrorDocument 503 /error_docs/maintenance.html

		IncludeOptional "/opt/psa/admin/conf/file_sharing.conf*"

		DirectoryIndex "index.html" "index.cgi" "index.pl" "index.php" "index.xhtml" "index.htm" "index.shtml"
		<IfModule mod_rewrite.c>
			RewriteEngine On
			RewriteCond %{HTTP_HOST} ^www\.Web-seo-it\.de$ [NC]
			RewriteRule ^(.*)$ https://Web-seo-it.de$1 [L,R=301]
		</IfModule>

		Include "/var/www/vhosts/system/Web-seo-it.de/conf/vhost_ssl.conf"

		<Directory /var/www/vhosts/Web-seo-it.de>
			AllowOverride AuthConfig FileInfo Indexes Limit Options=Indexes,SymLinksIfOwnerMatch,MultiViews,FollowSymLinks,ExecCGI,Includes,IncludesNOEXEC
		</Directory>

		<IfModule mod_headers.c>
		</IfModule>

		#extension letsencrypt begin
		Alias /.well-known/acme-challenge "/var/www/vhosts/default/htdocs/.well-known/acme-challenge"

		<Location /.well-known/acme-challenge/>
			# Require all granted
			Order Deny,Allow
			Allow from all
			Satisfy any
		</Location>

		<LocationMatch "^/.well-known/acme-challenge/(.*/|)\.">
			# Require all denied
			Order Allow,Deny
			Deny from all
		</LocationMatch>
		#extension letsencrypt end

		#extension sslit begin

		Header always set Strict-Transport-Security "max-age=15768000; includeSubDomains"

		#extension sslit end
	</VirtualHost>

</IfModule>

<VirtualHost [2a01:488:66:1000:b24d:4a96:0:1]:80 >
