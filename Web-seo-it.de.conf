		RewriteCond %{HTTP_HOST} ^www\.Web-seo-it\.de$ [NC]
		RewriteRule ^(.*)$ https://Web-seo-it.de$1 [L,R=301]
	</IfModule>

	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteCond %{HTTPS} off
		RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,QSA]
	</IfModule>
</VirtualHost>